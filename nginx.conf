worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Rutes temporals escrivibles (Cloud Run té el sistema de fitxers de només lectura)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Compressió
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    access_log /dev/stdout;

    server {
        # Cloud Run injecta el port 8080 per defecte
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Capçaleres de seguretat (equivalents al fitxer _headers)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; form-action 'self' https://formspree.io; base-uri 'self'; object-src 'none'" always;

        # Memòria cau llarga per a actius estàtics
        location ~* \.(css|js|svg|jpg|jpeg|png|webp|ico|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # Pàgines HTML servides sense extensió (ex: /avis-legal)
        location / {
            try_files $uri $uri.html $uri/ =404;
        }

        error_page 404 /index.html;
    }
}
