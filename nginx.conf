worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Rutes temporals escrivibles (Cloud Run té el sistema de fitxers de només lectura)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Compressió
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    access_log /dev/stdout;

    # Backend del formulari (gunicorn/Flask al mateix contenidor)
    upstream contact_backend {
        server 127.0.0.1:8000;
    }

    server {
        # Cloud Run injecta el port 8080 per defecte
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Redirecció de www cap al domini canònic (arrel)
        if ($host = www.juditcamps.com) {
            return 301 https://juditcamps.com$request_uri;
        }

        # Capçaleres de seguretat (form-action 'self': el formulari és propi)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://www.googletagmanager.com; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://www.google-analytics.com https://region1.google-analytics.com; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://analytics.google.com; form-action 'self'; base-uri 'self'; object-src 'none'" always;

        # API (formulari i analítica) -> backend. "^~" evita que la regla
        # d'actius estàtics (.css/.js) intercepti rutes del backend.
        location ^~ /api/ {
            proxy_pass http://contact_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Tauler d'audiència privat (/stats/<token>/) -> backend, sense logs
        # d'accés perquè el token no quedi escrit als registres.
        location ^~ /stats/ {
            access_log off;
            proxy_pass http://contact_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Memòria cau llarga per a actius estàtics
        location ~* \.(css|js|svg|jpg|jpeg|png|webp|ico|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # Pàgines HTML servides sense extensió (ex: /avis-legal)
        location / {
            try_files $uri $uri.html $uri/ =404;
        }

        error_page 404 /index.html;
    }
}
